[project]
name = "filedesc"
version = "0.1.0"
description = "Collect protobuf FileDescriptorProto messages including transitive dependencies"
readme = "README.md"
authors = [
    { name = "Takio Yamaoka", email = "y.takio@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mcap>=1.6.0",
    "protobuf>=7.36.2",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
