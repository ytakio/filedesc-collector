[project]
name = "filedesc-collector"
version = "0.1.0"
description = "Collect FileDescriptorSets including transitive dependencies"
requires-python = ">=3.9"
dependencies = [
    "protobuf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

