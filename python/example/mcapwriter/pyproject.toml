[project]
name = "mcapwriter-example"
version = "0.1.0"
description = "Example MCAP writer using filedesc-collector and the Foxglove SDK"
requires-python = ">=3.10"
dependencies = [
  "filedesc-collector",
  "foxglove-sdk>=0.30",
  "mcap-protobuf-support>=0.6.0",
  "protobuf>=5.0",
]

[project.scripts]
mcapwriter = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.uv.sources]
filedesc-collector = { path = "../..", editable = true }
